# The Android port: does it compile.
#
# That is the whole claim, and it is deliberately a small one. A green run here
# means an APK came out of the NDK. It does NOT mean the game starts, finds its
# assets, gets its arena below 4 GB or draws anything -- the first of those is
# not knowable without a device and the rest follow from it. See
# docs/ANDROID.md.
#
# Nothing in this job RUNS. The self-tests are host executables and a cross
# build produces binaries this runner cannot execute, so CMakeLists.txt does
# not build them for Android (BFBB_HOST_TOOLS) and ctest has nothing to do
# here. gcgate.py, pclink.py and --drift all stay on the desktop runners in
# pc-port.yml and build.yml, which is where the port is actually gated.
#
# A paths filter, unlike pc-port.yml, which deliberately has none. The reason
# that one has no filter is that bfbb.exe links the game code, so a change
# anywhere under src/ can break it. That is just as true here -- but this job
# adds nothing the desktop builds do not already catch for a change in shared
# code, and what it uniquely covers is the Android arms and the Gradle shell.
# Running it on every commit to the decomp would be paying for the NDK to
# confirm what four other jobs already said.
name: Android

# Not on pushes to treedome: pc-port.yml calls this workflow there, for the
# APK in the release, and running it here as well would build it twice.
on:
  push:
    branches-ignore: [treedome]
    paths:
      - 'android/**'
      - 'CMakeLists.txt'
      - 'src/SB/Core/pc/android/**'
      - 'src/SB/Core/pc/iHostPosix.cpp'
      - 'src/SB/Core/pc/bfbb_main.cpp'
      - 'src/SB/Core/pc/compat/intrin.h'
      - 'tools/android/**'
      - '.github/workflows/android.yml'
      - '.gitmodules'
  pull_request:
    paths:
      - 'android/**'
      - 'CMakeLists.txt'
      - 'src/SB/Core/pc/android/**'
      - 'src/SB/Core/pc/iHostPosix.cpp'
      - 'src/SB/Core/pc/bfbb_main.cpp'
      - 'src/SB/Core/pc/compat/intrin.h'
      - 'tools/android/**'
      - '.github/workflows/android.yml'
      - '.gitmodules'
  workflow_dispatch:
  # From pc-port.yml, with the tag of the draft release to upload the APK to.
  workflow_call:
    inputs:
      release:
        type: string
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    name: assembleDebug (arm64-v8a)

    # To upload to pc-port.yml's draft release.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Everything but wxWidgets, which is 300 MB of working tree for a
      # configurator this build switches off. The three Vulkan libraries are
      # for the default GL3;VULKAN build.
      - name: Submodules
        run: >
          git submodule update --init --recursive third_party/librw third_party/SDL
          third_party/Vulkan-Headers third_party/volk third_party/VulkanMemoryAllocator

      - name: Check the submodules came down
        run: |
          test -f third_party/librw/CMakeLists.txt || { echo "third_party/librw is empty"; exit 1; }
          test -f third_party/SDL/CMakeLists.txt || { echo "third_party/SDL is empty"; exit 1; }
          test -f third_party/SDL/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java \
            || { echo "third_party/SDL has no android-project; the Java half is compiled from there"; exit 1; }

      # The Android Gradle plugin pinned in android/build.gradle needs a 17.
      - name: JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned: the runner's own Gradle moved to 9, which cannot resolve the
      # Android Gradle plugin 8.7.3's classpath. No wrapper validation: this
      # build has no wrapper, and the only jar it would find is the one in
      # SDL's android-project, which is not run.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      # The runner image ships an SDK and at least one NDK; android/app/build.
      # gradle pins the NDK version it wants and Gradle installs it if the
      # image's is not that one.
      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # The job's actual assertion, and it is stronger than "gradle exited 0":
      # that an APK came out and that the game is INSIDE it. A misconfigured
      # externalNativeBuild produces a perfectly valid APK with no native
      # library in it and a build that looks green, which is the one way this
      # job could lie about the only thing it claims.
      - name: Check the APK came out, with the game in it
        working-directory: android
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $apk"
          ls -l "$apk"
          unzip -l "$apk" | grep '\.so$' || { echo "the APK contains no native libraries at all"; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libmain\.so' \
            || { echo "the APK has no lib/arm64-v8a/libmain.so -- the native build did not reach it"; exit 1; }

      # Straight to pc-port.yml's draft release, never to Actions artifacts:
      # those count against the account's storage quota, release assets do not.
      # A run of its own, for a pull request or a push, uploads nothing.
      - name: Upload to the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "$(ls android/app/build/outputs/apk/debug/*.apk | head -1)" bfbb-arm64-v8a.apk
          gh release upload "${{ inputs.release }}" bfbb-arm64-v8a.apk --clobber
